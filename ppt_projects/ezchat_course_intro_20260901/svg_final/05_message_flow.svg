<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" xml:lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS, sans-serif">
  <defs>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#E76F51"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2F5D62"/>
    </marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFF9EE"/>
  <g id="page-doodles" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" fill="none" stroke="#D7CBB5" stroke-width="2" stroke-linecap="round">
    <path d="M1172 60 q18 22 36 0"/><path d="M1180 88 l8 -10 l8 10 l8 -10"/>
    <path d="M78 654 l18 -8 l18 8 l18 -8"/>
  </g>
  <g id="page-header" data-pptx-bounds="64 38 1152 100">
    <text x="64" y="91" font-family="KaiTi, Trebuchet MS, serif" font-size="52" font-weight="bold" fill="#263238">一条消息，为什么不能“收到就广播”？</text>
    <path d="M66 115 Q272 105 468 116" fill="none" stroke="#E76F51" stroke-width="6" stroke-linecap="round" opacity="0.68"/>
  </g>
  <g id="message-sequence" data-pptx-bounds="64 150 1152 448">
    <rect x="64" y="166" width="1152" height="152" rx="24" fill="#F2ECD8"/>
    <rect x="64" y="352" width="1152" height="226" rx="24" fill="#FFF9EE" stroke="#D7CBB5" stroke-width="3"/>
    <text x="88" y="198" font-size="24" font-weight="bold" fill="#2F5D62">客户端</text>
    <text x="88" y="384" font-size="24" font-weight="bold" fill="#E76F51">服务端 + 数据库</text>
    <g id="step-input">
      <circle cx="174" cy="254" r="42" fill="#FFF9EE" stroke="#2F5D62" stroke-width="3"/>
      <!-- icon: tabler-outline/message-circle -->
  <g transform="translate(150, 230) scale(2)" fill="none" stroke="#2F5D62" stroke-width="2">
    <path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" />
  </g>
      <text x="174" y="304" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">输入并提交</text>
    </g>
    <g id="step-emit">
      <rect x="292" y="218" width="190" height="72" rx="18" fill="#FFF9EE" stroke="#E76F51" stroke-width="3"/>
      <text x="387" y="247" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="22" fill="#E76F51">message:send</text>
      <text x="387" y="276" text-anchor="middle" font-size="22" fill="#5D696B">Socket.IO 事件</text>
    </g>
    <path d="M220 254 Q252 242 288 254" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
    <path d="M486 254 Q526 292 548 380" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
    <g id="step-verify">
      <rect x="496" y="398" width="212" height="122" rx="20" fill="#F2ECD8" stroke="#E76F51" stroke-width="4"/>
      <!-- icon: tabler-outline/shield-lock -->
  <g transform="translate(516, 420) scale(1.75)" fill="none" stroke="#E76F51" stroke-width="2">
    <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
    <path d="M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
    <path d="M12 12l0 2.5" />
  </g>
      <text x="574" y="448" font-size="24" font-weight="bold" fill="#263238">先做双重校验</text>
      <text x="522" y="486" font-size="22" fill="#5D696B">① 是否为房间成员</text>
      <text x="522" y="514" font-size="22" fill="#5D696B">② 是否处于禁言状态</text>
    </g>
    <g id="rejected-branch">
      <path d="M552 526 Q520 548 462 548" fill="none" stroke="#E76F51" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
      <rect x="260" y="526" width="194" height="44" rx="20" fill="#E76F51" fill-opacity="0.16"/>
      <text x="357" y="556" text-anchor="middle" font-size="22" font-weight="bold" fill="#E76F51">不通过：拒绝发送</text>
    </g>
    <g id="step-persist">
      <rect x="754" y="398" width="178" height="122" rx="20" fill="#FFF9EE" stroke="#2F5D62" stroke-width="3"/>
      <!-- icon: tabler-outline/database -->
  <g transform="translate(818, 416) scale(2)" fill="none" stroke="#2F5D62" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
      <text x="843" y="488" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">Message 入库</text>
      <text x="843" y="514" text-anchor="middle" font-size="22" fill="#5D696B">保留聊天记录</text>
    </g>
    <path d="M712 458 Q730 446 750 458" fill="none" stroke="#2F5D62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <g id="step-broadcast">
      <rect x="978" y="398" width="214" height="122" rx="20" fill="#E9C46A" fill-opacity="0.52" stroke="#E76F51" stroke-width="3"/>
      <!-- icon: tabler-outline/arrows-exchange -->
  <g transform="translate(998, 420) scale(1.75)" fill="none" stroke="#E76F51" stroke-width="2">
    <path d="M7 10h14l-4 -4" />
    <path d="M17 14h-14l4 4" />
  </g>
      <text x="1056" y="448" font-size="24" font-weight="bold" fill="#263238">按房间广播</text>
      <text x="1085" y="486" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="22" fill="#263238">message:new</text>
      <text x="1085" y="514" text-anchor="middle" font-size="22" fill="#5D696B">io.to(room:id)</text>
    </g>
    <path d="M936 458 Q954 446 974 458" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
    <g id="step-refresh">
      <rect x="952" y="206" width="240" height="96" rx="20" fill="#FFF9EE" stroke="#2F5D62" stroke-width="3"/>
      <text x="1072" y="244" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">store 追加消息</text>
      <text x="1072" y="276" text-anchor="middle" font-size="22" fill="#5D696B">MessageList 响应式刷新</text>
    </g>
    <path d="M1085 394 Q1120 354 1090 306" fill="none" stroke="#2F5D62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <g id="sequence-labels" font-size="22" font-weight="bold" text-anchor="middle">
      <circle cx="124" cy="176" r="18" fill="#2F5D62"/><text x="124" y="183" fill="#FFF9EE">1</text>
      <circle cx="286" cy="206" r="18" fill="#E76F51"/><text x="286" y="213" fill="#FFF9EE">2</text>
      <circle cx="488" cy="390" r="18" fill="#E76F51"/><text x="488" y="397" fill="#FFF9EE">3</text>
      <circle cx="746" cy="390" r="18" fill="#2F5D62"/><text x="746" y="397" fill="#FFF9EE">4</text>
      <circle cx="970" cy="390" r="18" fill="#E76F51"/><text x="970" y="397" fill="#FFF9EE">5</text>
      <circle cx="944" cy="198" r="18" fill="#2F5D62"/><text x="944" y="205" fill="#FFF9EE">6</text>
    </g>
  </g>
  <g id="page-takeaway" data-pptx-bounds="64 614 1152 50">
    <rect x="64" y="614" width="1152" height="50" rx="18" fill="#F2ECD8"/>
    <text x="88" y="648" font-size="30" fill="#263238">核心顺序：<tspan fill="#E76F51" font-weight="bold">先校验 → 再落库 → 后广播</tspan>，前后端共同守住规则。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 672 1152 30">
    <text x="64" y="694" font-size="16" fill="#5D696B">MESSAGE FLOW</text>
    <text x="1216" y="694" text-anchor="end" font-size="16" fill="#5D696B">05</text>
  </g>
</svg>
