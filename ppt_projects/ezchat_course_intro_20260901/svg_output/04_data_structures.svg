        <path d="M1117 322 Q1132 346 1119 372" marker-end="url(#arrowCoral)"/>
        <path d="M1046 403 Q1034 392 1022 403" marker-end="url(#arrowCoral)"/>
        <path d="M946 372 Q930 346 946 322" marker-end="url(#arrowCoral)"/>
      </g>
      <text x="1031" y="474" text-anchor="middle" font-size="24" fill="#263238">state.status 驱动界面切换</text>
      <text x="1031" y="512" text-anchor="middle" font-size="22" fill="#5D696B">拒接、挂断、断连都回到 idle</text>
      <path d="M886 546 Q1028 562 1184 544" fill="none" stroke="#E9C46A" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
