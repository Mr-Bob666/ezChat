      <text x="92" y="254" font-size="24" fill="#5D696B">userId → socketId</text>
      <g id="map-entries" font-family="Consolas, Microsoft YaHei, monospace" font-size="24">
        <rect x="92" y="282" width="124" height="58" rx="14" fill="#FFF9EE"/>
        <text x="154" y="319" text-anchor="middle" fill="#263238">user_7</text>
        <path d="M222 311 Q246 300 266 311" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
        <rect x="274" y="282" width="108" height="58" rx="14" fill="#FFF9EE" stroke="#E76F51" stroke-width="3"/>
        <text x="328" y="319" text-anchor="middle" fill="#263238">s_A2</text>
        <rect x="92" y="358" width="124" height="58" rx="14" fill="#FFF9EE"/>
        <text x="154" y="395" text-anchor="middle" fill="#263238">user_9</text>
        <path d="M222 387 Q246 376 266 387" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
        <rect x="274" y="358" width="108" height="58" rx="14" fill="#FFF9EE" stroke="#E76F51" stroke-width="3"/>
        <text x="328" y="395" text-anchor="middle" fill="#263238">s_F8</text>
