  <g id="page-takeaway" data-pptx-bounds="64 614 1152 50">
    <rect x="64" y="614" width="1152" height="50" rx="18" fill="#E9C46A" fill-opacity="0.42"/>
    <text x="88" y="648" font-size="30" fill="#263238">Map 管<tspan fill="#E76F51" font-weight="bold">定位</tspan>，关系模型管<tspan fill="#E76F51" font-weight="bold">归属</tspan>，状态机管<tspan fill="#E76F51" font-weight="bold">变化</tspan>。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 672 1152 30">
