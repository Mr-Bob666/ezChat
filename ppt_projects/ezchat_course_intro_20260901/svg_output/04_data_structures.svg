      <rect x="92" y="458" width="290" height="94" rx="18" fill="#FFF9EE"/>
      <text x="112" y="494" font-size="24" font-weight="bold" fill="#E76F51">为什么选 Map？</text>
      <text x="112" y="529" font-size="22" fill="#5D696B">定向推送无需遍历全部连接</text>
      <text x="382" y="578" text-anchor="end" font-size="22" font-weight="bold" fill="#2F5D62">平均查询 O(1)</text>
    </g>
