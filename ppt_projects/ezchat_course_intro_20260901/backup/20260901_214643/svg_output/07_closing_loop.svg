<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" xml:lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS, sans-serif">
  <defs>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#E76F51"/>
    </marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFF9EE"/>
  <g id="page-doodles" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" fill="none" stroke="#D7CBB5" stroke-width="2" stroke-linecap="round">
    <path d="M1168 66 q16 -18 32 0 q16 18 32 0"/><circle cx="1198" cy="95" r="5"/>
    <path d="M80 654 l12 -12 l12 12 l12 -12 l12 12"/>
  </g>
  <g id="page-header" data-pptx-bounds="64 38 1152 100">
    <text x="64" y="91" font-family="KaiTi, Trebuchet MS, serif" font-size="52" font-weight="bold" fill="#263238">最后，回到一个完整的演示闭环</text>
    <path d="M66 115 Q252 105 430 116" fill="none" stroke="#E76F51" stroke-width="6" stroke-linecap="round" opacity="0.68"/>
  </g>
  <g id="demo-loop" data-pptx-bounds="64 154 650 440">
    <rect x="64" y="154" width="650" height="440" rx="28" fill="#F2ECD8"/>
    <text x="88" y="190" font-size="24" font-weight="bold" fill="#2F5D62">现场演示路径</text>
    <g id="demo-center">
      <circle cx="382" cy="380" r="78" fill="#E9C46A" fill-opacity="0.78" stroke="#2F5D62" stroke-width="4"/>
      <text x="382" y="372" text-anchor="middle" font-size="30" font-weight="bold" fill="#263238">ezChat</text>
      <text x="382" y="408" text-anchor="middle" font-size="24" fill="#263238">实时聊天闭环</text>
    </g>
    <g id="demo-nodes" text-anchor="middle">
      <g id="node-login">
        <circle cx="166" cy="274" r="52" fill="#FFF9EE" stroke="#2F5D62" stroke-width="3"/>
        <use data-icon="tabler-outline/users" x="144" y="242" width="44" height="44" fill="#2F5D62" stroke-width="2"/>
        <text x="166" y="310" font-size="22" font-weight="bold" fill="#263238">登录</text>
      </g>
      <g id="node-room">
        <circle cx="382" cy="226" r="52" fill="#FFF9EE" stroke="#E76F51" stroke-width="3"/>
        <use data-icon="tabler-outline/route" x="360" y="194" width="44" height="44" fill="#E76F51" stroke-width="2"/>
        <text x="382" y="262" font-size="22" font-weight="bold" fill="#263238">加入房间</text>
      </g>
      <g id="node-message">
        <circle cx="598" cy="312" r="52" fill="#FFF9EE" stroke="#2F5D62" stroke-width="3"/>
        <use data-icon="tabler-outline/message-circle" x="576" y="280" width="44" height="44" fill="#2F5D62" stroke-width="2"/>
        <text x="598" y="348" font-size="22" font-weight="bold" fill="#263238">发消息</text>
      </g>
      <g id="node-governance">
        <circle cx="542" cy="514" r="52" fill="#FFF9EE" stroke="#E9C46A" stroke-width="4"/>
        <use data-icon="tabler-outline/shield-lock" x="520" y="482" width="44" height="44" fill="#2F5D62" stroke-width="2"/>
        <text x="542" y="550" font-size="22" font-weight="bold" fill="#263238">管成员</text>
      </g>
      <g id="node-call">
        <circle cx="232" cy="514" r="52" fill="#E76F51"/>
        <use data-icon="tabler-outline/phone" x="210" y="482" width="44" height="44" fill="#FFF9EE" stroke-width="2"/>
        <text x="232" y="550" font-size="22" font-weight="bold" fill="#263238">打语音</text>
      </g>
    </g>
    <g id="demo-arrows" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round">
      <path d="M214 252 Q278 214 328 224" marker-end="url(#arrowCoral)"/>
      <path d="M434 232 Q520 238 570 270" marker-end="url(#arrowCoral)"/>
      <path d="M616 366 Q608 444 578 478" marker-end="url(#arrowCoral)"/>
      <path d="M488 526 Q382 558 286 526" marker-end="url(#arrowCoral)"/>
      <path d="M190 472 Q134 408 150 330" marker-end="url(#arrowCoral)"/>
    </g>
  </g>
  <g id="construction-method" data-pptx-bounds="754 154 462 440">
    <rect x="754" y="154" width="462" height="440" rx="28" fill="#FFF9EE" stroke="#D7CBB5" stroke-width="3"/>
    <text x="782" y="198" font-size="30" font-weight="bold" fill="#263238">项目构建思路</text>
    <path d="M784 216 Q902 208 1014 216" fill="none" stroke="#E9C46A" stroke-width="6" stroke-linecap="round"/>
    <g id="method-one">
      <circle cx="806" cy="282" r="30" fill="#2F5D62"/>
      <text x="806" y="291" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFF9EE">1</text>
      <text x="854" y="278" font-size="30" font-weight="bold" fill="#263238">先划分职责</text>
      <text x="854" y="312" font-size="24" fill="#5D696B">前端、后端、数据库各司其职</text>
    </g>
    <g id="method-two">
      <circle cx="806" cy="390" r="30" fill="#E76F51"/>
      <text x="806" y="399" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFF9EE">2</text>
      <text x="854" y="386" font-size="30" font-weight="bold" fill="#263238">再选择协议</text>
      <text x="854" y="420" font-size="24" fill="#5D696B">请求、事件、媒体分别处理</text>
    </g>
    <g id="method-three">
      <circle cx="806" cy="498" r="30" fill="#E9C46A"/>
      <text x="806" y="507" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">3</text>
      <text x="854" y="494" font-size="30" font-weight="bold" fill="#263238">最后收束状态</text>
      <text x="854" y="528" font-size="24" fill="#5D696B">用 Map、关系模型与 FSM 落地</text>
    </g>
    <text x="1188" y="570" text-anchor="end" font-family="KaiTi, Trebuchet MS, serif" font-size="30" font-weight="bold" fill="#E76F51">谢谢！</text>
  </g>
  <g id="page-takeaway" data-pptx-bounds="64 614 1152 50">
    <rect x="64" y="614" width="1152" height="50" rx="18" fill="#E9C46A" fill-opacity="0.42"/>
    <text x="88" y="648" font-size="30" fill="#263238">从一个消息框出发，得到一个<tspan fill="#E76F51" font-weight="bold">可演示、可解释、可继续扩展</tspan>的实时系统。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 672 1152 30">
    <text x="64" y="694" font-size="16" fill="#5D696B">SUMMARY</text>
    <text x="1216" y="694" text-anchor="end" font-size="16" fill="#5D696B">07</text>
  </g>
</svg>
