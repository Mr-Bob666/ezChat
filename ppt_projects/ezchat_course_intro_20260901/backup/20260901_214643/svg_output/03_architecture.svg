<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" xml:lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS, sans-serif">
  <defs>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#E76F51"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2F5D62"/>
    </marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFF9EE"/>
  <g id="page-doodles" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" fill="none" stroke="#D7CBB5" stroke-width="2" stroke-linecap="round">
    <path d="M1170 72 q18 -18 36 0 q-18 18 -36 0"/><path d="M1188 50 v44"/>
    <path d="M84 656 q18 -12 36 0 q18 12 36 0"/>
  </g>
  <g id="page-header" data-pptx-bounds="64 38 1152 100">
    <text x="64" y="91" font-family="KaiTi, Trebuchet MS, serif" font-size="52" font-weight="bold" fill="#263238">构建第一步：先分层，再分协议</text>
    <path d="M66 115 Q242 106 398 116" fill="none" stroke="#E76F51" stroke-width="6" stroke-linecap="round" opacity="0.68"/>
  </g>
  <g id="project-structure-evidence" data-pptx-bounds="64 154 308 444">
    <rect x="64" y="154" width="308" height="444" rx="18" fill="#F2ECD8" stroke="#D7CBB5" stroke-width="3"/>
    <text x="84" y="188" font-size="24" font-weight="bold" fill="#2F5D62">目录就是职责边界</text>
    <rect x="82" y="204" width="272" height="370" rx="12" fill="#FFF9EE"/>
    <image href="../images/image_002.png" x="94" y="216" width="248" height="346" preserveAspectRatio="xMidYMid meet"/>
    <text x="218" y="590" text-anchor="middle" font-size="18" fill="#5D696B">client / server 各自分层</text>
  </g>
  <g id="architecture-map" data-pptx-bounds="406 154 810 444">
    <g id="frontend-card">
      <rect x="416" y="170" width="254" height="164" rx="24" fill="#F2ECD8" stroke="#2F5D62" stroke-width="3"/>
      <use data-icon="tabler-outline/users" x="438" y="194" width="42" height="42" fill="#2F5D62" stroke-width="2"/>
      <text x="494" y="226" font-size="30" font-weight="bold" fill="#263238">前端 Vue 3</text>
      <text x="442" y="270" font-size="24" fill="#5D696B">组件负责交互</text>
      <text x="442" y="304" font-size="24" fill="#5D696B">Pinia 维护页面状态</text>
    </g>
    <g id="backend-card">
      <rect x="730" y="170" width="254" height="164" rx="24" fill="#FFF9EE" stroke="#E76F51" stroke-width="4"/>
      <use data-icon="tabler-outline/server" x="752" y="194" width="42" height="42" fill="#E76F51" stroke-width="2"/>
      <text x="808" y="226" font-size="30" font-weight="bold" fill="#263238">后端 Express</text>
      <text x="756" y="270" font-size="24" fill="#5D696B">路由 → 服务 → 模型</text>
      <text x="756" y="304" font-size="24" fill="#5D696B">校验业务规则与权限</text>
    </g>
    <g id="database-card">
      <rect x="1036" y="170" width="170" height="164" rx="24" fill="#E9C46A" fill-opacity="0.54" stroke="#2F5D62" stroke-width="3"/>
      <use data-icon="tabler-outline/database" x="1100" y="194" width="42" height="42" fill="#2F5D62" stroke-width="2"/>
      <text x="1121" y="270" text-anchor="middle" font-size="30" font-weight="bold" fill="#263238">MySQL</text>
      <text x="1121" y="304" text-anchor="middle" font-size="22" fill="#5D696B">Sequelize ORM</text>
    </g>
    <path d="M672 252 C692 252 708 252 726 252" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
    <text x="700" y="236" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="22" fill="#E76F51">HTTP</text>
    <path d="M986 252 C1002 252 1018 252 1032 252" fill="none" stroke="#2F5D62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <g id="protocol-lanes">
      <rect x="416" y="366" width="790" height="92" rx="22" fill="#F2ECD8"/>
      <use data-icon="tabler-outline/arrows-exchange" x="438" y="390" width="42" height="42" fill="#2F5D62" stroke-width="2"/>
      <text x="500" y="408" font-family="Consolas, Microsoft YaHei, monospace" font-size="24" font-weight="bold" fill="#2F5D62">Socket.IO</text>
      <text x="660" y="408" font-size="24" fill="#263238">消息广播 · 在线状态 · 通话信令</text>
      <text x="500" y="440" font-size="22" fill="#5D696B">长连接让“服务器主动通知客户端”成为可能</text>
      <path d="M470 370 Q722 338 944 370" fill="none" stroke="#2F5D62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    </g>
    <g id="webrtc-lane">
      <rect x="416" y="482" width="790" height="92" rx="22" fill="#FFF9EE" stroke="#E9C46A" stroke-width="4"/>
      <use data-icon="tabler-outline/phone" x="438" y="506" width="42" height="42" fill="#E76F51" stroke-width="2"/>
      <text x="500" y="524" font-family="Consolas, Microsoft YaHei, monospace" font-size="24" font-weight="bold" fill="#E76F51">WebRTC</text>
      <text x="654" y="524" font-size="24" fill="#263238">浏览器之间直接传输音频</text>
      <text x="500" y="556" font-size="22" fill="#5D696B">服务端只交换 offer / answer / ICE，不承载媒体流</text>
      <path d="M872 494 Q1010 454 1148 494" fill="none" stroke="#E76F51" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCoral)"/>
    </g>
  </g>
  <g id="page-takeaway" data-pptx-bounds="64 614 1152 50">
    <rect x="64" y="614" width="1152" height="50" rx="18" fill="#F2ECD8"/>
    <text x="88" y="648" font-size="30" fill="#263238">分层解决<tspan fill="#E76F51" font-weight="bold">“谁负责什么”</tspan>，协议分工解决<tspan fill="#E76F51" font-weight="bold">“信息怎样流动”</tspan>。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 672 1152 30">
    <text x="64" y="694" font-size="16" fill="#5D696B">ARCHITECTURE</text>
    <text x="1216" y="694" text-anchor="end" font-size="16" fill="#5D696B">03</text>
  </g>
</svg>
